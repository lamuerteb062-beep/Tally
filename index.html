<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#555;--line:#bbb;--acc:#000;--flash:#888;--bad:#000;--ok:#000;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#000;--ink:#fff;--mut:#aaa;--line:#444;--acc:#fff;--flash:#888;--bad:#fff;--ok:#fff;--on:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--ink:#fff;--mut:#aaa;--line:#444;--acc:#fff;--flash:#888;--bad:#fff;--ok:#fff;--on:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,Segoe UI,Arial,sans-serif;font-size:15px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#000;color:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;font-weight:800}
header h1 span{background:#fff;color:#000;padding:1px 8px;border-radius:2px;margin-right:8px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
button,select,input{font:inherit;color:inherit}
nav button{background:transparent;border:0;color:inherit;padding:7px 12px;border-radius:6px;cursor:pointer;opacity:.8}
nav button.on{background:#fff;color:#000;opacity:1;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:26px}.kpi small{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:120px}
button.b{background:var(--acc);color:var(--on);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--flash);outline-offset:1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--bg);font-weight:600;border-bottom:2px solid var(--ink)}th:first-child,td:first-child,.l{text-align:left}
.bad{font-weight:800;text-decoration:underline}.ok{font-weight:600}.mut{color:var(--mut)}
.msg{padding:8px 12px;border-radius:6px;margin-bottom:10px;background:var(--card);border:1px solid var(--line)}
.det{white-space:normal;text-align:left;color:var(--mut);font-size:12.5px}
textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);font-family:monospace;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs .on{background:var(--ink);color:var(--bg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
@media print{header,.np{display:none}body{background:#fff;color:#000}}

body{font-family:Figtree,system-ui,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3,.kpi b{font-family:Fraunces,Georgia,'Times New Roman',serif}
header{padding:16px 24px;gap:16px}
header h1{font-size:15px;font-weight:500;display:flex;align-items:center;gap:12px;opacity:1}
header h1 span{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:0 12px;border-radius:6px;margin:0;line-height:1.25}
nav button{border-radius:999px;padding:8px 16px;font-weight:500}
main{padding:28px 16px}
h2{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0 0 18px}
h3{font-size:19px;font-weight:600;margin:22px 0 10px}
.card{border-radius:14px;padding:20px;box-shadow:0 2px 0 var(--line)}
.kpi{border-radius:14px;padding:16px 18px}
.kpi b{font-size:36px;font-weight:700;line-height:1.1;margin-bottom:2px}
.kpi small{font-size:13px}
th{font-size:12.5px;letter-spacing:.02em}
th,td{padding:10px 12px}
tr:hover td{background:rgba(128,128,128,.09)}
input,select{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px}
input:focus,select:focus{border-color:var(--ink)}
button.b{border-radius:8px;padding:10px 20px}
button.g{border-radius:8px;padding:7px 12px}
.msg{border-left:4px solid var(--ink);border-radius:8px;padding:10px 14px}
header h1 span.wm{background:transparent;color:#fff;padding:0;font-size:38px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.wm b{font-size:.6em;vertical-align:super;font-weight:800;letter-spacing:.06em}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header><h1><span class="wm"><b>TALL</b><b>y</b></span></h1><nav id="nav"></nav><span id="hdr" style="display:flex;gap:8px;align-items:center"></span><button class="g" id="th" style="color:inherit" aria-label="Cambiar tema">Tema</button></header>
<main id="app"></main>
<script>
let SYM='Q';
let S={p:[],m:[],seq:1,u:[]},me=null,LAST=null,tab='inicio',msg='',kx={pid:'',met:'PROM',a:'',b:''},rep='inv',repF={q:'',c:''},mvTab='T',mvPid='',out='';
const today=new Date().toISOString().slice(0,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mny=n=>SYM+(+n).toFixed(2);
try{const r=localStorage.getItem('invflash');if(r)S=JSON.parse(r)}catch(e){}
const H1=s=>{let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return(h>>>0).toString(36)};
function ensureU(){if(!S.cfg)S.cfg={n:'Mi empresa',sym:'Q'};if(!S.log)S.log=[];SYM=S.cfg.sym;(S.p||[]).forEach(p=>{if(!p.cod)p.cod=nextCode()});if(!S.u||!S.u.length)S.u=[{u:'admin',h:H1('admin123'),r:'admin'},{u:'operador',h:H1('oper123'),r:'operador'},{u:'consulta',h:H1('cons123'),r:'consulta'}]}
ensureU();
const save=()=>{try{localStorage.setItem('invflash',JSON.stringify(S))}catch(e){}};
const prod=id=>S.p.find(p=>p.id==id);
const pl=id=>{const p=prod(id);return p?(p.cod?p.cod+' · ':'')+p.n:''};
function nextCode(){let n=S.p.length+1,c;do{c='P'+String(n++).padStart(3,'0')}while(S.p.some(p=>p.cod==c));return c}
const live=()=>S.m.filter(m=>!m.anu).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
const stock=id=>live().filter(m=>m.pid==id).reduce((s,m)=>s+(m.t=='E'?m.q:-m.q),0);

function kardex(pid,met){
  const rows=[];let lots=[],q=0,v=0;
  for(const m of live().filter(m=>m.pid==pid)){
    if(m.t=='E'){q+=m.q;v+=m.q*m.c;lots.push({d:m.d,q0:m.q,r:m.q,c:m.c});rows.push({m,uc:m.c,tot:m.q*m.c,q,v})}
    else{
      let need=m.q,cost=0,det=[];
      if(met=='PROM'){const a=q?v/q:0;cost=need*a;det=[]}
      else{
        const ord=met=='PEPS'?lots:[...lots].reverse();
        for(const l of ord){if(need<=0)break;if(!l.r)continue;const u=Math.min(l.r,need);l.r-=u;need-=u;cost+=u*l.c;det.push({d:l.d,q0:l.q0,u,r:l.r,c:l.c})}
      }
      q-=m.q;v-=cost;rows.push({m,uc:m.q?cost/m.q:0,tot:cost,q,v,det})
    }
  }
  return{rows,q,v,avg:q?v/q:0};
}


const TABS=[['inicio','Inicio'],['prod','Productos'],['mov','Movimientos'],['imp','Importar'],['kardex','Kardex'],['rep','Reportes'],['usr','Administración']];
const PERM={admin:['inicio','prod','mov','imp','kardex','rep','usr'],operador:['inicio','prod','mov','imp','kardex','rep'],consulta:['inicio','kardex','rep']};
function draw(){
  if(!me){$('#nav').innerHTML='';$('#hdr').innerHTML='';$('#app').innerHTML=loginView();msg='';return}
  if(!PERM[me.r].includes(tab))tab='inicio';
  draw0();
  $('h1').innerHTML='<span class="wm"><b>TALL</b><b>y</b></span>'+esc(S.cfg.n);
  $('#hdr').innerHTML=`<label style="color:inherit;flex-direction:row;align-items:center">Método&nbsp;<select onchange="kx.met=this.value;draw()">${[['PROM','Promedio ponderado'],['PEPS','PEPS'],['UEPS','UEPS']].map(x=>`<option value="${x[0]}" ${kx.met==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><span>${esc(me.u)} (${me.r})</span><button class="g" style="color:inherit" onclick="me=null;draw()">Salir</button>`;
}
function draw0(){
  $('#nav').innerHTML=TABS.filter(t=>PERM[me.r].includes(t[0])).map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#app').innerHTML=(msg?`<div class="msg np">${msg}</div>`:'')+V[tab]();
  msg='';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;EM=EP=null;draw()}});
$('#th').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()=='#000';d.dataset.theme=dark?'light':'dark'};

function chart(){
  const days={};live().forEach(m=>{days[m.d]=days[m.d]||{E:0,S:0};days[m.d][m.t]+=m.q});
  const ks=Object.keys(days).sort().slice(-8);if(!ks.length)return'<p class="mut">Aún no hay movimientos para graficar.</p>';
  const mx=Math.max(...ks.map(k=>Math.max(days[k].E,days[k].S)),1),W=520,H=170,bw=W/ks.length;
  const bars=ks.map((k,i)=>{const e=days[k].E/mx*(H-30),s=days[k].S/mx*(H-30),x=i*bw+6;
    return`<rect x="${x}" y="${H-20-e}" width="${bw/2-8}" height="${e}" fill="#2563eb"/><rect x="${x+bw/2-7}" y="${H-20-s}" width="${bw/2-8}" height="${s}" fill="#f59e0b"/><text x="${x}" y="${H-5}" font-size="10" fill="var(--mut)">${k.slice(5)}</text>`}).join('');
  return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px" role="img" aria-label="Entradas y salidas por día">${bars}</svg></div><small class="mut"><span class="dot" style="background:#2563eb"></span>Entradas <span class="dot" style="background:#f59e0b"></span>Salidas (unidades por día)</small>`;
}
const PAL=['#2563eb','#16a34a','#f59e0b','#dc2626','#9333ea','#0891b2','#db2777','#65a30d'],MN={PROM:'promedio ponderado',PEPS:'PEPS',UEPS:'UEPS'};
function pie(){const it=S.p.map(p=>({n:p.n,v:kardex(p.id,kx.met).v})).filter(x=>x.v>0.005),T=it.reduce((s,x)=>s+x.v,0);
 if(!T)return'<p class="mut">Sin inventario valorizado.</p>';
 let a=-Math.PI/2;
 const arcs=it.map((x,i)=>{const f=x.v/T,b=a+f*2*Math.PI,P=g=>[100+80*Math.cos(g),100+80*Math.sin(g)],p1=P(a),p2=P(b);a=b;
  return f>=.9999?`<circle cx="100" cy="100" r="80" fill="${PAL[i%8]}"/>`:`<path d="M100 100L${p1[0]} ${p1[1]}A80 80 0 ${f>.5?1:0} 1 ${p2[0]} ${p2[1]}Z" fill="${PAL[i%8]}" stroke="var(--card)" stroke-width="2"/>`}).join('');
 return`<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 200 200" style="width:200px" role="img" aria-label="Valor del inventario por producto">${arcs}</svg><div>${it.map((x,i)=>`<div><span class="dot" style="background:${PAL[i%8]}"></span>${esc(x.n)}: <b>${mny(x.v)}</b> (${(x.v/T*100).toFixed(1)}%)</div>`).join('')}</div></div>`}
function line(){const ds=[...new Set(live().map(m=>m.d))].sort();if(ds.length<2)return'<p class="mut">Se necesitan movimientos en al menos 2 fechas.</p>';
 const K=S.p.map(p=>kardex(p.id,kx.met).rows),vs=ds.map(d=>K.reduce((s,rs)=>{const r=rs.filter(r=>r.m.d<=d).pop();return s+(r?r.v:0)},0));
 const mx=Math.max(...vs,1),W=520,H=180,pad=34,X=i=>pad+i*(W-pad-10)/(ds.length-1),Y=v=>H-24-v/mx*(H-44);
 return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px" role="img" aria-label="Valor del inventario en el tiempo"><polyline fill="none" stroke="#2563eb" stroke-width="3" points="${vs.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="#2563eb"><title>${ds[i]}: ${mny(v)}</title></circle>`).join('')}<text x="4" y="14" font-size="10" fill="var(--mut)">${mny(mx)}</text><text x="${pad}" y="${H-6}" font-size="10" fill="var(--mut)">${ds[0].slice(5)}</text><text x="${W-40}" y="${H-6}" font-size="10" fill="var(--mut)">${ds[ds.length-1].slice(5)}</text></svg></div>`}
function cmp(){const M=[['PROM','Prom. ponderado'],['PEPS','PEPS'],['UEPS','UEPS']];
 const D=M.map(([k])=>{let inv=0,cv=0;S.p.forEach(p=>{const K=kardex(p.id,k);inv+=K.v;K.rows.forEach(r=>{if(r.m.t=='S')cv+=r.tot})});return[inv,cv]});
 const mx=Math.max(...D.flat(),1),W=520,H=190,bw=W/3;
 return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px" role="img" aria-label="Comparación de métodos">${D.map((d,i)=>[0,1].map(j=>{const h=d[j]/mx*(H-50),x=i*bw+30+j*(bw/2-30);return`<rect x="${x}" y="${H-24-h}" width="${bw/2-36}" height="${h}" fill="${j?'#dc2626':'#2563eb'}"><title>${mny(d[j])}</title></rect><text x="${x}" y="${H-28-h}" font-size="10" fill="var(--ink)">${mny(d[j])}</text>`}).join('')+`<text x="${i*bw+bw/2-30}" y="${H-6}" font-size="11" fill="var(--ink)">${M[i][1]}</text>`).join('')}</svg></div><small class="mut"><span class="dot" style="background:#2563eb"></span>Valor final del inventario <span class="dot" style="background:#dc2626"></span>Costo de ventas</small>`}
function topSold(){
  const t={};live().filter(m=>m.t=='S').forEach(m=>t[m.pid]=(t[m.pid]||0)+m.q);
  const a=Object.entries(t).sort((x,y)=>y[1]-x[1]).slice(0,5);if(!a.length)return'';
  const mx=a[0][1];
  return a.map(([id,q])=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="width:150px">${esc(pl(id))}</span><span style="background:#16a34a;height:14px;border-radius:3px;width:${q/mx*60}%"></span><b>${q}</b></div>`).join('');
}

const V={
imp(){return impView()},usr(){return usrView()},
inicio(){
  const L=live(),inv=S.p.reduce((s,p)=>s+stock(p.id),0),e=L.filter(m=>m.t=='E'&&m.d==today).length,s=L.filter(m=>m.t=='S'&&m.d==today).length;
  const al=S.p.filter(p=>stock(p.id)<=p.min).map(p=>{const q=stock(p.id);return`<li>${esc(p.n)}: <span class="bad">${q<0?'negativo':q==0?'agotado':'stock bajo ('+q+')'}</span></li>`}).join('');
  const rec=[...S.m].reverse().slice(0,6).map(m=>`<tr><td>${m.d}</td><td>${esc(pl(m.pid))}</td><td class="${m.t=='E'?'ok':'bad'}">${m.t=='E'?'Entrada':'Salida'}</td><td>${m.q}</td></tr>`).join('');
  return`<h2>Inicio</h2><div class="kpis"><div class="kpi"><b>${S.p.length}</b><small>Productos</small></div><div class="kpi"><b>${inv}</b><small>Stock actual (uds)</small></div><div class="kpi"><b>${e}</b><small>Entradas de hoy</small></div><div class="kpi"><b>${s}</b><small>Salidas de hoy</small></div></div>
  ${S.p.length?'':'<div class="card"><p>Todavía no hay datos. Crea tu primer producto en Productos o carga un archivo en Importar.</p></div>'}
  <div class="card"><h3 style="margin-top:0">Entradas vs. salidas</h3>${chart()}</div>
  <div class="card"><h3 style="margin-top:0">Productos más vendidos</h3>${topSold()||'<p class="mut">Sin salidas registradas.</p>'}</div>
  <div class="card"><h3 style="margin-top:0">Valor del inventario por producto (${MN[kx.met]})</h3>${pie()}</div>
  <div class="card"><h3 style="margin-top:0">Valor del inventario en el tiempo (${MN[kx.met]})</h3>${line()}</div>
  <div class="card"><h3 style="margin-top:0">Comparación de los tres métodos</h3>${cmp()}</div>
  <div class="card"><h3 style="margin-top:0">Alertas de inventario</h3>${al?'<ul>'+al+'</ul>':'<p class="mut">Sin alertas.</p>'}</div>
  <div class="card"><h3 style="margin-top:0">Movimientos recientes</h3><div class="tw"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th></tr>${rec||'<tr><td colspan="4" class="mut">Sin movimientos</td></tr>'}</table></div></div>`;
},
prod(){
  const e=prod(EP)||{};
  const rows=S.p.map(p=>{const q=stock(p.id);return`<tr><td>${esc(p.cod||'')}</td><td class="l">${esc(p.n)}</td><td>${esc(p.un||'')}</td><td>${esc(p.cat)}</td><td>${esc(p.prov)}</td><td class="${q<=p.min?'bad':''}">${q}</td><td>${p.min}</td><td>${mny(p.pv)}</td><td><button class="g" onclick="EP=${p.id};draw();scrollTo(0,0)">Editar</button> <button class="g" onclick="delP(${p.id})">Eliminar</button></td></tr>`}).join('');
  return`<h2>Productos</h2><div class="card np"><div class="row"><label>Código<input id="pcod" value="${esc(e.cod||'')}" style="min-width:90px"></label><label>Nombre<input id="pn" value="${esc(e.n||'')}"></label><label>Unidad<input id="pun" value="${esc(e.un||'')}" placeholder="unidad, caja…" style="min-width:90px"></label><label>Categoría<input id="pc" value="${esc(e.cat||'')}"></label><label>Proveedor<input id="pv" value="${esc(e.prov&&e.prov!='—'?e.prov:'')}"></label><label>Stock mínimo<input id="pm" type="number" min="0" value="${e.min??5}"></label><label>Precio de venta<input id="pp" type="number" min="0" step="0.01" value="${e.pv||0}"></label>${EP?'':'<label>Stock inicial<input id="pis" type="number" min="0" value="0"></label><label>Costo unitario inicial<input id="pic" type="number" min="0" step="0.01" value="0"></label>'}<button class="b" onclick="addP()">${EP?'Guardar cambios':'Crear producto'}</button>${EP?'<button class="g" onclick="EP=null;draw()">Cancelar</button>':''}</div></div>
  <div class="card tw"><table><tr><th>Código</th><th>Producto</th><th>Unidad</th><th>Categoría</th><th>Proveedor</th><th>Stock</th><th>Mínimo</th><th>Precio</th><th class="np"></th></tr>${rows||'<tr><td colspan="9" class="mut">Crea un producto para empezar.</td></tr>'}</table></div>`;
},
mov(){
  const em=S.m.find(m=>m.id==EM)||{};
  const opts=S.p.map(p=>`<option value="${p.id}" ${em.pid==p.id?'selected':''}>${p.cod?esc(p.cod)+' · ':''}${esc(p.n)} (stock ${stock(p.id)})</option>`).join('');
  let list=[...S.m].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).filter(m=>(mvTab=='T'||m.t==mvTab)&&(!mvPid||m.pid==mvPid));

function autoMap(rows){
 const h=rows[0].map(c=>String(c).toLowerCase().trim()),map={};let hasH=false;
 for(const k in SYN){const i=h.findIndex(c=>c&&SYN[k].some(s=>c==s||c.includes(s)));if(i>=0&&!Object.values(map).includes(i)){map[k]=i;hasH=true}}

async function impLoad(f){if(!f)return;IM={busy:'Leyendo archivo… las fotos y PDF escaneados pueden tardar un poco.'};draw();
 try{const rows=(await readFile(f)).filter(r=>r.some(c=>String(c).trim()!==''));if(!rows.length)throw new Error('No se encontró texto en el archivo.');
  const a=autoMap(rows);IM={rows,map:a.map,hasH:a.hasH,nc:Math.max(...rows.map(r=>r.length)),def:{t:'E',p:''}};impBuild();msg='Archivo leído. Revisa el mapeo y la vista previa antes de importar.'}
 catch(e){IM=null;msg='No se pudo leer el archivo: '+esc(e.message||e)+'. Si es PDF o foto, verifica tu conexión a internet.'}
 draw()}
function impView(){
 let h=`<h2>Importar información</h2><div class="card"><p>Sube Excel, CSV, TXT, PDF o una foto (JPG, PNG). Los datos se cargan una sola vez y luego eliges el método de valuación en el menú superior.</p><input type="file" accept=".xlsx,.xls,.csv,.txt,.pdf,.png,.jpg,.jpeg" onchange="impLoad(this.files[0])"><p class="mut">${IM&&IM.busy||''}</p></div>`;
 if(!IM||!IM.items)return h;
 const sel=k=>`<label>${NM[k]}<select onchange="IM.map.${k}=this.value===''?undefined:+this.value;impBuild();draw()"><option value="">(ninguna)</option>${Array.from({length:IM.nc},(_,i)=>`<option value="${i}" ${IM.map[k]===i?'selected':''}>Col. ${i+1}${IM.hasH?': '+esc(IM.rows[0][i]):''}</option>`).join('')}</select></label>`;
 const it=IM.items,ok=it.filter(o=>o.on).length;
 return h+`<div class="card"><h3 style="margin-top:0">Columnas detectadas (puedes cambiarlas)</h3><div class="row">${Object.keys(NM).map(sel).join('')}</div><div class="row"><label>Tipo si no viene en el archivo<select onchange="IM.def.t=this.value;impBuild();draw()"><option value="E" ${IM.def.t=='E'?'selected':''}>Entrada</option><option value="S" ${IM.def.t=='S'?'selected':''}>Salida</option></select></label><label>Producto si no viene<select onchange="IM.def.p=this.value;impBuild();draw()"><option value="">(ninguno)</option>${S.p.map(p=>`<option ${IM.def.p==p.n?'selected':''}>${esc(p.n)}</option>`).join('')}</select></label></div><small class="mut">Las fechas se leen como día/mes/año.</small></div>
 <div class="card"><b>${it.filter(o=>!o.err&&!o.dup).length}</b> válidos · <b class="bad">${it.filter(o=>o.err).length}</b> con error · <b>${it.filter(o=>o.dup).length}</b> duplicados<datalist id="pl">${S.p.map(p=>`<option value="${esc(p.n)}">`).join('')}</datalist><div class="tw"><table><tr><th></th><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Costo</th><th>Estado</th></tr>${it.map((o,i)=>`<tr><td><input type="checkbox" ${o.on?'checked':''} ${o.err?'disabled':''} onchange="IM.items[${i}].on=this.checked;draw()"></td><td><input type="date" value="${o.d}" onchange="impEd(${i},'d',this.value)"></td><td><input list="pl" value="${esc(o.pn)}" onchange="impEd(${i},'pn',this.value.trim())"></td><td><select onchange="impEd(${i},'t',this.value)"><option value="E" ${o.t=='E'?'selected':''}>Entrada</option><option value="S" ${o.t=='S'?'selected':''}>Salida</option></select></td><td><input type="number" style="min-width:70px;width:80px" value="${o.q??''}" onchange="impEd(${i},'q',+this.value)"></td><td><input type="number" step="0.01" style="min-width:70px;width:90px" value="${o.c}" onchange="impEd(${i},'c',+this.value)"></td><td class="${o.err?'bad':o.dup?'':'ok'}">${o.err||(o.dup?'duplicado':'válido')}</td></tr>`).join('')}</table></div><p><button class="b" onclick="impGo()">Importar ${ok} filas</button></p></div>`}
function impGo(){let ok=0,sk=0;
 for(const o of IM.items.filter(o=>o.on).sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t))){
  let p=S.p.find(p=>p.n.toLowerCase()==o.pn.toLowerCase());
  if(!p){p={id:Date.now()+Math.floor(Math.random()*1e6),cod:o.cod||nextCode(),n:o.pn,cat:'General',prov:'—',min:5,pv:0};S.p.push(p)}
  if(o.t=='S'){const dis=live().filter(m=>m.pid==p.id&&m.d<=o.d).reduce((s,m)=>s+(m.t=='E'?m.q:-m.q),0);if(o.q>dis){sk++;continue}}
  S.m.push({id:S.seq++,pid:p.id,t:o.t,d:o.d,q:o.q,c:o.t=='E'?o.c:0,doc:o.doc,anu:null});ok++}
 logA('Importó '+ok+' filas');save();IM=null;tab='kardex';msg=`Importadas ${ok} filas.`+(sk?` Se omitieron ${sk} salidas porque superaban el stock disponible.`:'');draw()}
function usrView(){return`<h2>Administración</h2><div class="card np"><h3 style="margin-top:0">Empresa</h3><div class="row"><label>Nombre de la empresa<input id="cn" value="${esc(S.cfg.n)}"></label><label>Símbolo de moneda<input id="cs" value="${esc(S.cfg.sym)}" style="min-width:60px;width:80px"></label><button class="b" onclick="saveCfg()">Guardar</button></div></div><h3>Usuarios</h3><div class="card np"><div class="row"><label>Usuario<input id="nu"></label><label>Contraseña (mín. 4)<input id="npw" type="password"></label><label>Rol<select id="nr"><option value="operador">operador</option><option value="consulta">consulta</option><option value="admin">admin</option></select></label><button class="b" onclick="addU()">Crear usuario</button></div></div><div class="card tw"><table><tr><th>Usuario</th><th>Rol</th><th></th></tr>${S.u.map((x,i)=>`<tr><td>${esc(x.u)}</td><td><select onchange="chRol(${i},this.value)">${['admin','operador','consulta'].map(r=>`<option ${x.r==r?'selected':''}>${r}</option>`).join('')}</select></td><td><button class="g" onclick="rstU(${i})">Restablecer clave</button> <button class="g" onclick="delU(${i})">Eliminar</button></td></tr>`).join('')}</table></div><p class="mut">Administrador: todo. Operador: productos, movimientos, importar, Kardex y reportes. Consulta: solo Inicio, Kardex y reportes.</p><h3>Registro de actividades</h3><div class="card tw"><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th></tr>${[...S.log].reverse().slice(0,60).map(l=>`<tr><td>${esc(l.t)}</td><td class="l">${esc(l.u)}</td><td class="l">${esc(l.a)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Sin actividad.</td></tr>'}</table></div>`}
function addU(){const u=$('#nu').value.trim(),w=$('#npw').value;if(!u||w.length<4||S.u.some(x=>x.u==u)){msg='Escribe un usuario nuevo y una contraseña de al menos 4 caracteres.';return draw()}S.u.push({u,h:H1(w),r:$('#nr').value});logA('Creó usuario '+u);save();msg='Usuario creado.';draw()}
function chRol(i,r){const x=S.u[i];if(x==me||(x.r=='admin'&&S.u.filter(y=>y.r=='admin').length<2)){msg='No puedes cambiar ese rol (tu propio usuario o el único administrador).';return draw()}logA('Cambió rol de '+x.u+' a '+r);x.r=r;save();msg='Rol actualizado.';draw()}
function rstU(i){const w=prompt('Nueva contraseña (mín. 4):');if(!w||w.length<4)return;S.u[i].h=H1(w);save();msg='Clave restablecida.';draw()}
function delU(i){const x=S.u[i];if(x==me||(x.r=='admin'&&S.u.filter(y=>y.r=='admin').length<2)){msg='No puedes eliminar ese usuario.';return draw()}logA('Eliminó usuario '+x.u);S.u.splice(i,1);save();msg='Usuario eliminado.';draw()}
let IM=null,EM=null,EP=null;
function logA(a){S.log.push({t:new Date().toLocaleString(),u:me?me.u:'-',a});if(S.log.length>500)S.log.shift()}
function saveCfg(){S.cfg={n:$('#cn').value.trim()||'Mi empresa',sym:$('#cs').value.trim()||'Q'};SYM=S.cfg.sym;(S.p||[]).forEach(p=>{if(!p.cod)p.cod=nextCode()});logA('Actualizó datos de la empresa');save();msg='Datos guardados.';draw()}
draw();
</script>
</body>
</html>
